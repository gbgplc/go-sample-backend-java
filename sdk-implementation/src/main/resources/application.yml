server:
  port: 8080

spring:
  application:
    name: onboarding-service
  jackson:
    default-property-inclusion: non_null

app:
  market: northbank
  cors-allowed-origins:
    - http://localhost:3000

go:
  mode: mock
  region: eu
  # Only read when go.mode=live — never commit real values, set via env vars.
  client-id: ${GBG_CLIENT_ID:}
  client-secret: ${GBG_CLIENT_SECRET:}
  # Password grant only (the nonprod fabric tenants) — ignored under
  # client_credentials. Every market's own application-<market>.yml
  # previously documented these two env vars (.env.example, run.sh) without
  # actually binding them anywhere, so setting them had no effect and
  # password-grant token minting failed silently. Wired here, once, so every
  # market profile inherits it rather than repeating the same two lines four
  # times.
  username: ${GBG_USERNAME:}
  password: ${GBG_PASSWORD:}

session:
  ttl-minutes: 30
  cookie-name: onboarding_session

logging:
  level:
    com.gbg.samples.onboarding: INFO
