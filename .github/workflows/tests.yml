# Runs both implementations' test suites on every pull request and on main.
# The tests need no Go credentials: live Go is stubbed throughout.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.implementation }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        implementation: [api-implementation, sdk-implementation]
    defaults:
      run:
        working-directory: ${{ matrix.implementation }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.implementation }}/pom.xml
      - run: mvn -B test
